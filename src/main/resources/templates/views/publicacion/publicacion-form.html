<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head (#{msg.publicacion-form.page.title})}"></head>

<body class="d-flex flex-column h-100">

<header th:replace="~{fragments/header :: header}"></header>

<main class="form-page">
    <div class="form-card">

        <!-- El mismo formulario sirve para alta y edición:
             si el DTO no tiene id es un alta (PublicacionCreateDTO), si lo tiene es una edición -->
        <h1 th:text="${publicacion.id} == null ? #{msg.publicacion-form.title.new} : #{msg.publicacion-form.title.edit}"></h1>

        <!-- Mensaje de error global (llega como flash desde el controller) -->
        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

        <!-- th:object enlaza el formulario con el DTO "publicacion" del Model.
             *{campo} = publicacion.campo -->
        <form th:action="${publicacion.id} == null ? @{/publicaciones/insert} : @{/publicaciones/update}"
              th:object="${publicacion}" method="post" class="mt-3">

            <!-- El id viaja oculto (en el alta va vacío) -->
            <input type="hidden" th:field="*{id}"/>

            <!-- Libro: el <select> de la relación 1:N (pauta 6) -->
            <div class="mb-3">
                <label for="libroId" class="form-label" th:text="#{msg.publicacion.field.libro}">Libro</label>
                <select id="libroId" class="form-select" th:field="*{libroId}">
                    <!-- Opción vacía: si se queda elegida, libroId llega null y salta @NotNull -->
                    <option value="" th:text="#{msg.publicacion-form.libro.select}">-- Selecciona un libro --</option>
                    <!-- Una opción por cada LibroDTO de ${libros}. En edición sale marcado el libro actual -->
                    <option th:each="libro : ${libros}"
                            th:value="${libro.id}"
                            th:text="${libro.titulo} + ' (' + ${libro.autor} + ')'"></option>
                </select>
                <div class="text-danger" th:if="${#fields.hasErrors('libroId')}" th:errors="*{libroId}"></div>
            </div>

            <!-- Precio -->
            <div class="mb-3">
                <label for="precio" class="form-label" th:text="#{msg.publicacion.field.precio}">Precio</label>
                <input type="number" id="precio" th:field="*{precio}" class="form-control"/>
                <div class="text-danger" th:if="${#fields.hasErrors('precio')}" th:errors="*{precio}"></div>
            </div>

            <!-- Descripción -->
            <div class="mb-3">
                <label for="descripcion" class="form-label" th:text="#{msg.publicacion.field.descripcion}">Descripción</label>
                <input type="text" id="descripcion" th:field="*{descripcion}" class="form-control"/>
                <div class="text-danger" th:if="${#fields.hasErrors('descripcion')}" th:errors="*{descripcion}"></div>
            </div>

            <!-- Fecha de publicación (texto, para poder probar la validación propia del formato) -->
            <div class="mb-3">
                <label for="fechaPublicacion" class="form-label" th:text="#{msg.publicacion.field.fechaPublicacion}">Fecha</label>
                <input type="text" id="fechaPublicacion" th:field="*{fechaPublicacion}" class="form-control"
                       placeholder="aaaa-mm-dd"/>
                <div class="text-danger" th:if="${#fields.hasErrors('fechaPublicacion')}" th:errors="*{fechaPublicacion}"></div>
            </div>

            <!-- Botones -->
            <button type="submit" class="btn btn-primary"
                    th:text="${publicacion.id} == null ? #{msg.action.create} : #{msg.action.update}">Guardar</button>
            <a th:href="@{/publicaciones}" class="btn btn-secondary" th:text="#{msg.action.backList}">Volver</a>
        </form>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
